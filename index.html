<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Anwesenheit-NEO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" />

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    window.FIREBASE_API_KEY             = "{{FIREBASE_API_KEY}}";
    window.FIREBASE_AUTH_DOMAIN         = "{{FIREBASE_AUTH_DOMAIN}}";
    window.FIREBASE_PROJECT_ID          = "{{FIREBASE_PROJECT_ID}}";
    window.FIREBASE_STORAGE_BUCKET      = "{{FIREBASE_STORAGE_BUCKET}}";
    window.FIREBASE_MESSAGING_SENDER_ID = "{{FIREBASE_MESSAGING_SENDER_ID}}";
    window.FIREBASE_APP_ID              = "{{FIREBASE_APP_ID}}";
    window.FIREBASE_MEASUREMENT_ID      = "{{FIREBASE_MEASUREMENT_ID}}";
  </script>

  <style>
    /* ── Login-Screen ─────────────────────────────────────────── */
    #login-screen {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--color-bg);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      padding: 36px 32px 32px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10);
    }
    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      justify-content: center;
    }
    .login-logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .login-logo-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--color-text);
      letter-spacing: -0.01em;
    }
    .login-card h2 {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 0 0 6px;
      text-align: center;
    }
    .login-card .login-subtitle {
      font-size: 0.88rem;
      color: var(--color-text-muted);
      text-align: center;
      margin-bottom: 28px;
    }
    .login-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .login-field label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--color-text);
    }
    .login-pw-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .login-pw-wrap input {
      width: 100%;
      padding-right: 44px;
    }
    #toggle-pw {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 50%;
      transition: color 0.15s, background 0.15s;
    }
    #toggle-pw:hover { color: var(--color-primary); background: var(--color-primary-highlight); }
    #login-submit-btn {
      width: 100%;
      margin-top: 8px;
      padding: 11px;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    #login-error { margin-top: 10px; min-height: 36px; }
    .login-error-box {
      background: rgba(161,44,123,0.08);
      border: 1px solid var(--color-error, #a12c7b);
      color: var(--color-error, #a12c7b);
      border-radius: 8px;
      padding: 9px 13px;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    #forgot-pw-btn {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 7px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--color-text-muted);
      text-align: center;
      border-radius: 8px;
      transition: color 0.15s, background 0.15s;
    }
    #forgot-pw-btn:hover {
      color: var(--color-primary);
      background: var(--color-primary-highlight);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) {
      .login-card { padding: 28px 20px 24px; }
    }
  </style>
</head>
<body>

  <!-- ═══ LOGIN-SCREEN (wird ausgeblendet wenn eingeloggt) ═══ -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">
          <span class="material-icons" style="font-size:22px;">how_to_reg</span>
        </div>
        <span class="login-logo-title" id="login-app-title">Anwesenheit-NEO</span>
      </div>
      <h2>Anmelden</h2>
      <p class="login-subtitle">Bitte melde dich mit deinem Konto an.</p>

      <form id="login-form" autocomplete="on" novalidate>
        <div class="login-field">
          <label for="login-email">E-Mail-Adresse</label>
          <input
            id="login-email"
            type="email"
            name="email"
            autocomplete="email"
            placeholder="deine@email.de"
            required
          />
        </div>
        <div class="login-field">
          <label for="login-password">Passwort</label>
          <div class="login-pw-wrap">
            <input
              id="login-password"
              type="password"
              name="password"
              autocomplete="current-password"
              placeholder="Passwort"
              required
            />
            <button type="button" id="toggle-pw" aria-label="Passwort anzeigen/verstecken" tabindex="-1">
              <span class="material-icons" style="font-size:20px;">visibility</span>
            </button>
          </div>
        </div>

        <div id="login-error"></div>

        <button type="submit" id="login-submit-btn" class="btn-primary">
          <span id="login-btn-text">Anmelden</span>
          <span id="login-spinner" class="material-icons" hidden style="animation:spin 0.8s linear infinite;font-size:18px;">refresh</span>
        </button>
      </form>

      <button type="button" id="forgot-pw-btn">Passwort vergessen?</button>
    </div>
  </div>

  <!-- ═══ APP-SHELL (wird eingeblendet wenn eingeloggt) ═══ -->
  <div id="app-root" hidden>
    <div class="app-shell">
      <header class="app-bar">
        <div class="app-brand">
          <div id="app-logo" class="app-logo"></div>
          <span id="app-title">Anwesenheit-NEO</span>
        </div>

        <div class="app-actions desktop-only" id="app-actions-desktop">
          <span id="app-user-name"
            style="font-size:0.88rem;opacity:0.85;margin-right:2px;cursor:pointer;text-decoration:underline dotted;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;"
            title="Mein Konto"></span>
          <button id="profile-btn" class="btn-text btn-icon" hidden title="Konto">
            <span class="material-icons">manage_accounts</span>
            <span class="btn-label">Konto</span>
          </button>
          <button id="logout-btn" class="btn-text btn-icon" hidden title="Abmelden">
            <span class="material-icons">logout</span>
            <span class="btn-label">Abmelden</span>
          </button>
        </div>

        <button id="mobile-menu-btn" class="btn-icon-only mobile-only" title="Menü" aria-label="Menü">
          <span class="material-icons">menu</span>
        </button>
      </header>

      <div id="mobile-drawer-overlay" class="mobile-drawer-overlay" hidden></div>
      <aside id="mobile-drawer" class="mobile-drawer" hidden>
        <div class="mobile-drawer-header">
          <div style="display:flex;align-items:center;gap:10px;min-width:0;">
            <span class="material-icons" style="font-size:2rem;color:var(--color-primary);">account_circle</span>
            <div style="min-width:0;">
              <div id="mobile-user-name" style="font-weight:600;font-size:0.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
              <div style="font-size:0.8rem;color:var(--color-text-muted);">Angemeldet</div>
            </div>
          </div>
          <button id="mobile-drawer-close" class="mobile-drawer-close" aria-label="Schließen" title="Schließen">
            <span class="material-icons">close</span>
          </button>
        </div>
        <div id="mobile-role-switcher" class="mobile-drawer-section"></div>
        <div class="mobile-drawer-section">
          <button id="mobile-profile-btn" class="mobile-drawer-btn" hidden>
            <span class="material-icons">manage_accounts</span>
            <span>Konto</span>
          </button>
          <button id="mobile-logout-btn" class="mobile-drawer-btn" hidden>
            <span class="material-icons">logout</span>
            <span>Abmelden</span>
          </button>
        </div>
      </aside>

      <main id="app-content" class="app-content">
        <div class="loading-center">Laden...</div>
      </main>
    </div>
  </div>

  <script src="/js/firebase-init.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/rate-limit.js"></script>
  <script src="/modules/settings.js"></script>
  <script src="/modules/profile.js"></script>
  <script src="/modules/member-dashboard.js"></script>
  <script src="/modules/trainer-dashboard.js"></script>
  <script src="/modules/coordinator-dashboard.js"></script>
  <script src="/modules/admin-dashboard.js"></script>
  <script src="/modules/statistics.js"></script>
  <script src="/modules/system-messages.js"></script>
  <script src="/modules/member-report.js"></script>
  <script src="/js/auth.js"></script>

  <script>
    (function() {
      const menuBtn   = document.getElementById('mobile-menu-btn');
      const drawer    = document.getElementById('mobile-drawer');
      const overlay   = document.getElementById('mobile-drawer-overlay');
      const closeBtn  = document.getElementById('mobile-drawer-close');

      function isMobile() {
        return window.matchMedia('(max-width: 639px)').matches;
      }

      function openDrawer() {
        if (!isMobile()) return;
        drawer.hidden = false;
        overlay.hidden = false;
        document.body.style.overflow = 'hidden';
      }

      function closeDrawer() {
        drawer.hidden = true;
        overlay.hidden = true;
        document.body.style.overflow = '';
      }

      function syncDrawerState() {
        if (!isMobile()) closeDrawer();
      }

      menuBtn?.addEventListener('click', openDrawer);
      closeBtn?.addEventListener('click', closeDrawer);
      overlay?.addEventListener('click', closeDrawer);
      window.addEventListener('resize', syncDrawerState);
      window._mobileDrawerClose = closeDrawer;
      syncDrawerState();
    })();
  </script>
</body>
</html>
