<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Anwesenheit-NEO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" />

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <div id="app-bar">
    <div id="app-bar-left">
      <button id="mobile-menu-btn" class="icon-btn" hidden>
        <span class="material-icons">menu</span>
      </button>
      <span id="app-logo" class="app-logo"></span>
    </div>
    <div id="app-actions-desktop"></div>
    <div id="app-actions-mobile">
      <div id="mobile-role-switcher"></div>
      <button id="mobile-profile-btn" class="icon-btn" hidden>
        <span class="material-icons">account_circle</span>
      </button>
    </div>
  </div>

  <div id="mobile-drawer" hidden>
    <div id="drawer-overlay"></div>
    <div id="drawer-panel">
      <button id="drawer-close-btn" class="icon-btn">
        <span class="material-icons">close</span>
      </button>
      <div id="drawer-content"></div>
    </div>
  </div>

  <div id="app-content"></div>

  <div id="modal-overlay" hidden>
    <div id="modal-box">
      <div id="modal-header">
        <span id="modal-title"></span>
        <button id="modal-close" class="icon-btn"><span class="material-icons">close</span></button>
      </div>
      <div id="modal-body"></div>
      <div id="modal-footer">
        <button id="modal-cancel" class="btn-secondary">Abbrechen</button>
        <button id="modal-confirm" class="btn-primary">OK</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/js/firebase-init.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/rate-limit.js"></script>
  <script src="/modules/settings.js"></script>
  <script src="/modules/profile.js"></script>
  <script src="/modules/member-dashboard.js"></script>
  <script src="/modules/trainer-dashboard.js"></script>
  <script src="/modules/coordinator-dashboard.js"></script>
  <script src="/modules/admin-dashboard.js"></script>
  <script src="/modules/statistics.js"></script>
  <script src="/modules/system-messages.js"></script>
  <script src="/modules/member-report.js"></script>
  <script src="/js/auth.js"></script>

  <script>
    (() => {
      const menuBtn  = document.getElementById('mobile-menu-btn');
      const drawer   = document.getElementById('mobile-drawer');
      const overlay  = document.getElementById('drawer-overlay');
      const closeBtn = document.getElementById('drawer-close-btn');

      function isMobile() { return window.innerWidth < 768; }

      function openDrawer() {
        drawer.hidden = false;
        document.body.style.overflow = 'hidden';
      }

      function closeDrawer() {
        drawer.hidden = true;
        document.body.style.overflow = '';
      }

      function syncDrawerState() {
        if (!isMobile()) closeDrawer();
      }

      menuBtn?.addEventListener('click', openDrawer);
      closeBtn?.addEventListener('click', closeDrawer);
      overlay?.addEventListener('click', closeDrawer);
      window.addEventListener('resize', syncDrawerState);
      window._mobileDrawerClose = closeDrawer;
      syncDrawerState();
    })();
  </script>
</body>
</html>
